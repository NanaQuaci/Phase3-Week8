name: E-Commerce QA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------
  # 1. UI TESTS (BDD + Selenide)
  # ------------------------
  ui-tests:
    name: 🧪 UI Tests
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for tests
        run: docker build -t ecommerce_ui_tests .

      - name: Run tests with Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
        env:
          COMPOSE_FILE: docker-compose.yml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Cucumber JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json
          path: target/cucumber.json

  # ------------------------
  # 2. PERFORMANCE TESTS (JMeter)
  # ------------------------
  performance:
    name: 📊 JMeter Load Test
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run JMeter test plan
        run: |
          mkdir -p jmeter-results
          docker run --rm -v ${{ github.workspace }}:/jmeter \
            justb4/jmeter \
            -n -t /jmeter/performance/ProductStore_Performance_Test_Plan.jmx \
            -l /jmeter/jmeter-results/results.jtl \
            -e -o /jmeter/jmeter-results/html-report

      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: jmeter-results

  # ------------------------
  # 3. SECURITY TESTS (OWASP ZAP)
  # ------------------------
  security:
    name: 🔒 OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()

    steps:
      - name: Prepare security report folder
        run: |
          mkdir -p security/security_report
          chmod 777 security/security_report

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/security/security_report:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://www.demoblaze.com \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: security/security_report/

  # ------------------------
  # 4. JIRA INTEGRATION (Xray)
  # ------------------------
  jira-xray:
    name: 📌 Push Results to Jira/Xray
    runs-on: ubuntu-latest
    needs: [ui-tests]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Cucumber JSON results
        uses: actions/download-artifact@v4
        with:
          name: cucumber-json
          path: target

      - name: Verify cucumber.json exists
        run: |
          ls -la target/
          test -f target/cucumber.json || (echo "❌ target/cucumber.json missing!" && exit 1)
          echo "✅ cucumber.json found successfully"

      - name: Get Xray Auth Token
        id: xray-auth
        run: |
          response=$(curl -s -X POST https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d "{ \"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\" }")
          token=$(echo $response | tr -d '"')
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Push Cucumber Results to Xray
        run: |
          curl -s -X POST https://xray.cloud.getxray.app/api/v2/import/execution/cucumber \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
            --data-binary @target/cucumber.json

  # ------------------------
  # 5. DEPLOY ALL REPORTS (CONSOLIDATED)
  # ------------------------
  deploy-reports:
    name: 🚀 Deploy All Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ui-tests, performance, security]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create reports directory structure
      - name: Create reports directory
        run: |
          mkdir -p reports/allure-report
          mkdir -p reports/cucumber-report
          mkdir -p reports/jmeter-report
          mkdir -p reports/zap-report

      # ---------- ALLURE REPORT ----------
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        run: allure generate allure-results --clean -o reports/allure-report

      # ---------- CUCUMBER REPORT ----------
      - name: Download Cucumber JSON artifact
        uses: actions/download-artifact@v4
        with:
          name: cucumber-json
          path: cucumber-json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cucumber-html-reporter
        run: |
          npm init -y
          npm install cucumber-html-reporter --save-dev

      - name: Generate Cucumber HTML report
        run: |
          node -e "
          const reporter = require('cucumber-html-reporter');
          const options = {
            theme: 'bootstrap',
            jsonFile: 'cucumber-json/cucumber.json',
            output: 'reports/cucumber-report/index.html',
            reportSuiteAsScenarios: true,
            launchReport: false,
            metadata: {
              'Test Environment': 'Demoblaze E-Commerce',
              'Browser': 'Chrome',
              'Platform': 'Ubuntu Latest',
              'Parallel': 'Scenarios',
              'Executed': 'GitHub Actions'
            }
          };
          reporter.generate(options);
          "

      # ---------- JMETER REPORT ----------
      - name: Download JMeter results
        uses: actions/download-artifact@v4
        with:
          name: jmeter-results
          path: jmeter-results

      - name: Copy JMeter report
        run: cp -r jmeter-results/html-report/* reports/jmeter-report/

      # ---------- ZAP REPORT ----------
      - name: Download ZAP report artifact
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: security-report

      - name: Copy ZAP report
        run: cp -r security-report/* reports/zap-report/

      # ---------- CREATE INDEX PAGE ----------
      - name: Create reports index page
        run: |
          cat > reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>E-Commerce QA Test Reports</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 40px 20px;
              }
              .container {
                max-width: 1200px;
                margin: 0 auto;
              }
              h1 {
                color: white;
                text-align: center;
                margin-bottom: 50px;
                font-size: 2.5em;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
              }
              .reports-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 30px;
                margin-bottom: 40px;
              }
              .report-card {
                background: white;
                border-radius: 15px;
                padding: 30px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                text-decoration: none;
                color: inherit;
                display: block;
              }
              .report-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 40px rgba(0,0,0,0.3);
              }
              .report-icon {
                font-size: 3em;
                margin-bottom: 15px;
                display: block;
              }
              .report-title {
                font-size: 1.5em;
                font-weight: bold;
                margin-bottom: 10px;
                color: #333;
              }
              .report-description {
                color: #666;
                line-height: 1.6;
              }
              .footer {
                text-align: center;
                color: white;
                margin-top: 40px;
                font-size: 0.9em;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🧪 E-Commerce QA Test Reports</h1>
              <div class="reports-grid">
                <a href="allure-report/index.html" class="report-card">
                  <span class="report-icon">📊</span>
                  <div class="report-title">Allure Report</div>
                  <div class="report-description">
                    Comprehensive UI test results with detailed steps, screenshots, and trends
                  </div>
                </a>
          
                <a href="cucumber-report/index.html" class="report-card">
                  <span class="report-icon">🥒</span>
                  <div class="report-title">Cucumber Report</div>
                  <div class="report-description">
                    BDD scenarios with Gherkin syntax showing feature test outcomes
                  </div>
                </a>
          
                <a href="jmeter-report/index.html" class="report-card">
                  <span class="report-icon">⚡</span>
                  <div class="report-title">JMeter Report</div>
                  <div class="report-description">
                    Performance and load testing metrics with response times and throughput
                  </div>
                </a>
          
                <a href="zap-report/zap-report.html" class="report-card">
                  <span class="report-icon">🔒</span>
                  <div class="report-title">OWASP ZAP Report</div>
                  <div class="report-description">
                    Security vulnerability scan results and risk assessments
                  </div>
                </a>
              </div>
              <div class="footer">
                Generated by GitHub Actions • E-Commerce QA Automation Pipeline
              </div>
            </div>
          </body>
          </html>
          EOF

      # ---------- DEPLOY EVERYTHING AT ONCE ----------
      - name: Deploy all reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          publish_branch: gh-pages
          force_orphan: true

  # ------------------------
  # 6. SLACK NOTIFICATION
  # ------------------------
  notify-slack:
    name: 🔔 Slack Notification
    runs-on: ubuntu-latest
    needs: [ui-tests, performance, security, deploy-reports, jira-xray]
    if: always()

    steps:
      - name: Send Slack notification
        run: |
          # Default values
          STATUS="success"
          COLOR="good"
          EMOJI="✅"
          TITLE="*E-Commerce QA Pipeline Passed*"
          
          # If any upstream job failed
          if [[ "${{ needs.ui-tests.result }}" == "failure" || \
                "${{ needs.performance.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" ]]; then
            STATUS="completed_with_failures"
            COLOR="warning"
            EMOJI="⚠️"
            TITLE="*E-Commerce QA Pipeline Completed with Failures*"
          fi
          
          # If any job was cancelled or skipped
          if [[ "${{ needs.ui-tests.result }}" == "cancelled" || \
                "${{ needs.performance.result }}" == "cancelled" || \
                "${{ needs.security.result }}" == "cancelled" || \
                "${{ needs.ui-tests.result }}" == "skipped" || \
                "${{ needs.performance.result }}" == "skipped" || \
                "${{ needs.security.result }}" == "skipped" ]]; then
            STATUS="failed"
            COLOR="danger"
            EMOJI="❌"
            TITLE="*E-Commerce QA Pipeline Failed*"
          fi

          # Get the repo owner and name
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)

          curl -X POST -H 'Content-type: application/json' --data "{
            \"attachments\": [
              {
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$EMOJI $TITLE\n*Status:* $STATUS\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Reports:*\\n• <https://${REPO_OWNER}.github.io/${REPO_NAME}/|📊 All Reports Dashboard>\\n• <https://${REPO_OWNER}.github.io/${REPO_NAME}/allure-report/|Allure>\\n• <https://${REPO_OWNER}.github.io/${REPO_NAME}/cucumber-report/|Cucumber>\\n• <https://${REPO_OWNER}.github.io/${REPO_NAME}/jmeter-report/|JMeter>\\n• <https://${REPO_OWNER}.github.io/${REPO_NAME}/zap-report/zap-report.html|ZAP Security>\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Build:*\\n<$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|View Run #$GITHUB_RUN_NUMBER>\"
                      }
                    ]
                  }
                ]
              }
            ]
          }" ${{ secrets.SLACK_WEBHOOK_URL }}